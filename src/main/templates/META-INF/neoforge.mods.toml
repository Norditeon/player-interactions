modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Leonardo"
description='''
Interacciones afectuosas entre jugadores: abrazos, chocar los cinco, besos y más,
elegidas desde una rueda con clic derecho y con consentimiento del otro jugador.
'''

# Las poses de los brazos se aplican con un mixin sobre el modelo del jugador (solo cliente).
[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
